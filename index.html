<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weinstation — Decretum & Depesche</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #161414;
      --wine-red: #801b2b;
      --wine-hover: #a32237;
      --gold-accent: #c5a059;
      --gold-border: rgba(197, 160, 89, 0.3);
      --text-primary: #f2ebd9;
      --text-secondary: #a69c8d;
      --input-bg: #211e1e;
      --border-color: #2a2525;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--gold-border);
      border-radius: 12px;
      padding: 36px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(197, 160, 89, 0.05);
      text-align: center;
      position: relative;
    }

    .juris-badge {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-accent);
      border: 1px solid var(--gold-border);
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: normal;
      letter-spacing: 0.02em;
      margin: 0 0 6px 0;
      color: var(--text-primary);
      border-bottom: 1px solid var(--gold-border);
      padding-bottom: 12px;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 10px;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: block;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-accent);
      margin-bottom: 8px;
      margin-top: 20px;
    }

    /* JURISTISCHE ABSENDER BUTTONS */
    .sender-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn-sender {
      font-family: "Georgia", serif;
      background: var(--input-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 10px 6px;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-sender:hover {
      border-color: var(--gold-accent);
      color: var(--gold-accent);
    }

    .btn-sender.active {
      background: var(--wine-red);
      color: #ffffff;
      border-color: var(--gold-accent);
      font-weight: bold;
      box-shadow: 0 0 10px rgba(128, 27, 43, 0.5);
    }

    .custom-sender-toggle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      display: block;
      margin: 6px auto 0 auto;
      transition: color 0.2s ease;
    }

    .custom-sender-toggle:hover {
      color: var(--gold-accent);
    }

    #customSenderContainer {
      display: none;
      margin-top: 10px;
    }

    #customSenderContainer.active {
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-primary);
      font-family: "Georgia", serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    select option {
      background-color: #161414;
      color: var(--text-primary);
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold-accent);
    }

    .mode-group {
      display: none;
    }

    .mode-group.active {
      display: block;
    }

    /* HARDWARE PREVIEW DISPLAY */
    .oled-hardware-container {
      margin-top: 24px;
      background: #050505;
      border: 1px solid var(--gold-border);
      border-radius: 6px;
      padding: 12px;
      text-align: left;
    }

    .oled-header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--gold-accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #222;
      padding-bottom: 5px;
      margin-bottom: 8px;
    }

    .oled-text {
      font-family: "SF Mono", "Courier New", monospace;
      font-size: 0.85rem;
      color: #34c759;
      min-height: 36px;
      word-break: break-word;
      line-height: 1.3;
    }

    /* WINE RED BUTTON */
    .btn-submit {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background-color: var(--wine-red);
      color: var(--text-primary);
      border: 1px solid var(--gold-accent);
      border-radius: 6px;
      font-family: "Georgia", serif;
      font-size: 1rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--wine-hover);
      box-shadow: 0 0 12px rgba(163, 34, 55, 0.4);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    #status {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin-top: 14px;
      font-size: 0.8rem;
      min-height: 18px;
    }

    .footer-legal {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin-top: 20px;
      font-size: 0.68rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="juris-badge">§ WEINSTATION DECRETUM</div>
    <h1>Elektronische Depesche</h1>
    <div class="subtitle">Übermittlung einer amtlichen Anweisung oder Mitteilung an das Display.</div>

    <form id="msgForm">
      <!-- ABSENDER SELEKTION -->
      <label>Absender der Erklärung</label>
      <div class="sender-buttons">
        <button type="button" class="btn-sender active" onclick="selectSender('Katharina', this)">Katharina</button>
        <button type="button" class="btn-sender" onclick="selectSender('Jakob', this)">Jakob</button>
        <button type="button" class="btn-sender" onclick="selectSender('Gast', this)">Gast</button>
      </div>

      <button type="button" class="custom-sender-toggle" onclick="toggleCustomSender()">＋ Anderen Namen eingeben</button>

      <div id="customSenderContainer">
        <input type="text" id="customSenderInput" placeholder="Name eingeben..." maxlength="15">
      </div>

      <!-- MODUS SELEKTION -->
      <label for="category">Kategorie / Rubrum</label>
      <select id="category">
        <option value="URTEIL">⚖️ Gerichtliches Urteil</option>
        <option value="TEXT">📜 Freie Mitteilung</option>
        <option value="STATUS">📌 Status-Dekret</option>
        <option value="COUNTDOWN">⏱️ Frist & Countdown</option>
        <option value="WINE">🍷 Wein-Gutachten</option>
      </select>

      <!-- MODUS 1: URTEIL (STANDARD JURISTISCH) -->
      <div id="mode-URTEIL" class="mode-group active">
        <label for="verdictSelect">Tenor der Entscheidung</label>
        <select id="verdictSelect">
          <option value="Der Beklagte wird verurteilt, unverzüglich Wein nachzuschenken.">Der Beklagte wird verurteilt, unverzüglich Wein nachzuschenken.</option>
          <option value="Einstweilige Verfügung: Sofortiger Stopp von Hausarbeiten!">Einstweilige Verfügung: Sofortiger Stopp von Hausarbeiten!</option>
          <option value="Beweisbeschluss: Die Qualität erfordert ein zweites Glas.">Beweisbeschluss: Die Qualität erfordert ein zweites Glas.</option>
          <option value="Urteil: Feierabend mit sofortiger Wirkung rechtskräftig.">Urteil: Feierabend mit sofortiger Wirkung rechtskräftig.</option>
        </select>
      </div>

      <!-- MODUS 2: FREIER TEXT -->
      <div id="mode-TEXT" class="mode-group">
        <label for="msgText">Freier Wortlaut</label>
        <textarea id="msgText" rows="2" placeholder="Text der Mitteilung..." maxlength="60"></textarea>
      </div>

      <!-- MODUS 3: STATUS -->
      <div id="mode-STATUS" class="mode-group">
        <label for="statusSelect">Aktueller Status</label>
        <select id="statusSelect">
          <option value="🍷 Feierabend-Modus aktiv">🍷 Feierabend-Modus aktiv</option>
          <option value="🔋 Akku leer – bitte Wein/Kaffee einschenken">🔋 Akku leer – bitte Wein/Kaffee einschenken</option>
          <option value="🤫 Ruhe vor dem Gericht: Bitte nicht stören">🤫 Ruhe vor dem Gericht: Bitte nicht stören</option>
          <option value="🎉 Das Wochenende ist offiziell eingeläutet!">🎉 Das Wochenende ist offiziell eingeläutet!</option>
        </select>
      </div>

      <!-- MODUS 4: COUNTDOWN -->
      <div id="mode-COUNTDOWN" class="mode-group">
        <label for="cdText">Bezeichnung der Frist</label>
        <input type="text" id="cdText" placeholder="z. B. Beratungsende" maxlength="25">
        <label for="cdMinutes">Restdauer (in Minuten)</label>
        <input type="number" id="cdMinutes" placeholder="15" min="1" max="180">
      </div>

      <!-- MODUS 5: WEIN-TASTING -->
      <div id="mode-WINE" class="mode-group">
        <label for="wineName">Rebsorte / Jahrgang</label>
        <input type="text" id="wineName" placeholder="Pinot Noir 2021" maxlength="25">
        <label for="winePairing">Empfohlene Speise</label>
        <input type="text" id="winePairing" placeholder="Käse & Pasta 🧀" maxlength="25">
      </div>

      <!-- DISPLAY LIVE PREVIEW -->
      <div class="oled-hardware-container">
        <div class="oled-header">
          <span>OLED Vorschau</span>
          <span>Weinstation OS</span>
        </div>
        <div class="oled-text" id="oledPreviewText">Katharina: ...</div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Absenden & Zustellen</button>
    </form>

    <div id="status"></div>

    <div class="footer-legal">
      Gez. Weinstation Gerichtshof • Übertragung via Google Endpunkt
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnutAtTGoe5NSJNGCXOPCnNCqpKH9ptNpTWo9zDJlE56ymWBP5DLfzmMCXDYvIpJs/exec";

    let selectedSenderName = "Katharina";
    let isCustomSender = false;

    const categorySelect = document.getElementById("category");
    const previewText = document.getElementById("oledPreviewText");
    const customSenderInput = document.getElementById("customSenderInput");
    const customSenderContainer = document.getElementById("customSenderContainer");

    function selectSender(name, buttonElement) {
      isCustomSender = false;
      selectedSenderName = name;
      
      document.querySelectorAll('.btn-sender').forEach(b => b.classList.remove('active'));
      buttonElement.classList.add('active');
      
      customSenderContainer.classList.remove('active');
      customSenderInput.value = "";
      
      updatePreview();
    }

    function toggleCustomSender() {
      isCustomSender = true;
      document.querySelectorAll('.btn-sender').forEach(b => b.classList.remove('active'));
      customSenderContainer.classList.add('active');
      customSenderInput.focus();
      updatePreview();
    }

    function getActiveSender() {
      if (isCustomSender) {
        return customSenderInput.value.trim() || "Absender";
      }
      return selectedSenderName;
    }

    function updatePreview() {
      const sender = getActiveSender();
      const category = categorySelect.value;
      let msg = "";

      switch (category) {
        case "URTEIL":
          msg = document.getElementById("verdictSelect").value;
          break;
        case "TEXT":
          msg = document.getElementById("msgText").value;
          break;
        case "STATUS":
          msg = document.getElementById("statusSelect").value;
          break;
        case "COUNTDOWN":
          const name = document.getElementById("cdText").value || "Frist";
          const mins = document.getElementById("cdMinutes").value || "0";
          msg = `⏱️ ${name} in ${mins} Min!`;
          break;
        case "WINE":
          const w = document.getElementById("wineName").value || "Wein";
          const p = document.getElementById("winePairing").value || "Gute Laune";
          msg = `🍷 ${w} | Passt zu: ${p}`;
          break;
      }

      previewText.innerText = `${sender}: ${msg || "..."}`;
    }

    categorySelect.addEventListener("change", function() {
      document.querySelectorAll('.mode-group').forEach(g => g.classList.remove('active'));
      const activeGroup = document.getElementById('mode-' + this.value);
      if (activeGroup) activeGroup.classList.add('active');
      updatePreview();
    });

    document.querySelectorAll("input, textarea, select").forEach(element => {
      element.addEventListener("input", updatePreview);
      element.addEventListener("change", updatePreview);
    });

    // Sende-Logik
    document.getElementById("msgForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");
      const sender = getActiveSender();
      const category = categorySelect.value;
      
      let msg = "";

      switch (category) {
        case "URTEIL": msg = document.getElementById("verdictSelect").value; break;
        case "TEXT": msg = document.getElementById("msgText").value; break;
        case "STATUS": msg = document.getElementById("statusSelect").value; break;
        case "COUNTDOWN":
          const name = document.getElementById("cdText").value || "Frist";
          const mins = document.getElementById("cdMinutes").value || "0";
          msg = `⏱️ ${name} in ${mins} Min!`;
          break;
        case "WINE":
          const w = document.getElementById("wineName").value || "Wein";
          const p = document.getElementById("winePairing").value || "Gute Laune";
          msg = `🍷 ${w} | Passt zu: ${p}`;
          break;
      }

      btn.disabled = true;
      btn.innerText = "Zustellung läuft...";
      status.style.color = "#a69c8d";
      status.innerText = "Verbindung wird aufgebaut...";

      const formData = new URLSearchParams();
      formData.append("sender", sender);
      formData.append("category", category);
      formData.append("message", msg);

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData.toString()
      })
      .then(() => {
        status.style.color = "#34c759";
        status.innerText = "✓ Erfolgreich zugestellt!";
        btn.disabled = false;
        btn.innerText = "Absenden & Zustellen";
      })
      .catch(err => {
        status.style.color = "#ff453a";
        status.innerText = "Fehler bei der Zustellung.";
        btn.disabled = false;
        btn.innerText = "Absenden & Zustellen";
      });
    });

    // Initiale Vorschau laden
    updatePreview();
  </script>
</body>
</html>
