<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amtliche Übermittlung | Weinstation ⚖️🍷</title>
  <style>
    :root {
      --bg-color: #0b0d12;
      --card-bg: rgba(26, 32, 48, 0.75);
      --accent: #e5c158;
      --accent-glow: rgba(229, 193, 88, 0.3);
      --text: #f8f9fa;
      --subtext: #a0aec0;
      --border-color: rgba(229, 193, 88, 0.25);
    }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      background: radial-gradient(circle at top, #1a2333 0%, #0b0d12 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7), 0 0 20px var(--accent-glow);
      width: 100%;
      max-width: 440px;
      text-align: center;
      border: 1px solid var(--border-color);
      transition: transform 0.3s ease;
    }

    .header-icon {
      font-size: 2.5rem;
      margin-bottom: 5px;
      filter: drop-shadow(0 0 8px var(--accent));
      animation: pulse 2.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    h1 {
      margin-top: 0;
      font-size: 1.35rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    p {
      color: var(--subtext);
      font-size: 0.85rem;
      margin-bottom: 20px;
      font-style: italic;
    }

    /* EXPRESS BUTTONS */
    .quick-signals {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .quick-btn {
      background: rgba(229, 193, 88, 0.1);
      border: 1px solid var(--border-color);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      background: var(--accent);
      color: #0b0d12;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.78rem;
      color: var(--accent);
      margin-bottom: 6px;
      margin-top: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: rgba(11, 13, 18, 0.8);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    select option {
      background-color: #1a2030;
      color: var(--text);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .mode-group {
      display: none;
    }

    .mode-group.active {
      display: block;
    }

    /* LIVE DISPLAY PREVIEW */
    .oled-preview {
      margin-top: 20px;
      background: #000;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 12px;
      text-align: left;
      font-family: "Courier New", Courier, monospace;
      color: #00ffcc;
      box-shadow: inset 0 0 10px rgba(0,255,204,0.2), 0 0 8px rgba(0,0,0,0.8);
    }

    .oled-header {
      font-size: 0.65rem;
      color: #555;
      text-transform: uppercase;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .oled-text {
      font-size: 0.85rem;
      word-break: break-word;
      min-height: 38px;
    }

    button[type="submit"] {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e5c158, #b89228);
      color: #0b0d12;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.1s, box-shadow 0.2s;
    }

    button[type="submit"]:hover {
      box-shadow: 0 6px 20px rgba(229, 193, 88, 0.5);
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    #status {
      margin-top: 15px;
      font-size: 0.85rem;
      min-height: 20px;
      font-weight: bold;
    }

    .legal-notice {
      margin-top: 20px;
      font-size: 0.7rem;
      color: #526078;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-icon">⚖️ 🍷</div>
    <h1>Zustellungsanzeige</h1>
    <p>Formelle Übermittlung einer Willenserklärung an die Weinstation</p>

    <!-- SCHNELLAUSWAHL BUTTONS -->
    <div class="quick-signals">
      <button class="quick-btn" onclick="setQuick('Rüge', 'Bitte unverzüglich Wein nachschenken! 🍷')">🍷 Nachschenken</button>
      <button class="quick-btn" onclick="setQuick('Status', '🎉 Feierabend & Prost!')">🥂 Prost</button>
      <button class="quick-btn" onclick="setQuick('Status', '🧀 Bitte Käse servieren!')">🧀 Käse</button>
    </div>

    <form id="msgForm">
      <!-- ABSENDER -->
      <label for="sender">§ 1 Absender / Erklärender:</label>
      <input type="text" id="sender" placeholder="z. B. Parteigänger Anna" required maxlength="15" oninput="updatePreview()">

      <!-- MODUS WÄHLEN -->
      <label for="category">§ 2 Verfahrungsart / Modus:</label>
      <select id="category" onchange="switchMode(this.value)">
        <option value="TEXT">Freie Botschaft / Rüge</option>
        <option value="URTEIL">Gerichtliches Urteil / Beschluss</option>
        <option value="STATUS">Status & Gefühlsbarometer</option>
        <option value="COUNTDOWN">Ereignis / Countdown</option>
        <option value="QUIZ">Rätsel / Quiz-Frage</option>
        <option value="WINE">Wein-Tasting / Empfehlung</option>
      </select>

      <!-- MODUS 1: FREIER TEXT -->
      <div id="mode-TEXT" class="mode-group active">
        <label for="msgText">§ 3 Gegenstand der Erklärung:</label>
        <textarea id="msgText" rows="2" placeholder="Gegenstand der schriftlichen Rüge..." maxlength="60" oninput="updatePreview()"></textarea>
      </div>

      <!-- MODUS 2: URTEIL -->
      <div id="mode-URTEIL" class="mode-group">
        <label for="verdictSelect">§ 3 Gerichtlicher Tenor:</label>
        <select id="verdictSelect" onchange="updatePreview()">
          <option value="Der Beklagte wird verurteilt, unverzüglich Wein nachzuschenken.">Der Beklagte wird verurteilt, unverzüglich Wein nachzuschenken.</option>
          <option value="Einstweilige Verfügung: Sofortiger Stopp von Hausarbeiten!">Einstweilige Verfügung: Sofortiger Stopp von Hausarbeiten!</option>
          <option value="Beweisbeschluss: Die Qualität erfordert ein zweites Glas.">Beweisbeschluss: Die Qualität erfordert ein zweites Glas.</option>
          <option value="Urteil: Feierabend mit sofortiger Wirkung rechtskräftig.">Urteil: Feierabend mit sofortiger Wirkung rechtskräftig.</option>
        </select>
      </div>

      <!-- MODUS 3: STATUS -->
      <div id="mode-STATUS" class="mode-group">
        <label for="statusSelect">§ 3 Aktueller Status:</label>
        <select id="statusSelect" onchange="updatePreview()">
          <option value="🍷 Feierabend-Modus aktiv">🍷 Feierabend-Modus aktiv</option>
          <option value="🔋 Akku leer – bitte Wein/Kaffee einschenken">🔋 Akku leer – bitte Wein/Kaffee einschenken</option>
          <option value="🤫 Ruhe vor dem Gericht: Bitte nicht stören">🤫 Ruhe vor dem Gericht: Bitte nicht stören</option>
          <option value="🎉 Das Wochenende ist offiziell eingeläutet!">🎉 Das Wochenende ist offiziell eingeläutet!</option>
        </select>
      </div>

      <!-- MODUS 4: COUNTDOWN -->
      <div id="mode-COUNTDOWN" class="mode-group">
        <label for="cdText">§ 3 Ereignisbezeichnung:</label>
        <input type="text" id="cdText" placeholder="z. B. Pizza da" maxlength="25" oninput="updatePreview()">
        <label for="cdMinutes">§ 3a Verbleibende Minuten:</label>
        <input type="number" id="cdMinutes" placeholder="z. B. 15" min="1" max="180" oninput="updatePreview()">
      </div>

      <!-- MODUS 5: QUIZ -->
      <div id="mode-QUIZ" class="mode-group">
        <label for="quizQuestion">§ 3 Quiz-Frage:</label>
        <input type="text" id="quizQuestion" placeholder="z. B. Wer hat heute den Abwasch gemacht?" maxlength="50" oninput="updatePreview()">
      </div>

      <!-- MODUS 6: WEIN-TASTING -->
      <div id="mode-WINE" class="mode-group">
        <label for="wineName">§ 3 Weinbezeichnung / Jahrgang:</label>
        <input type="text" id="wineName" placeholder="z. B. Pinot Noir 2021" maxlength="25" oninput="updatePreview()">
        <label for="winePairing">§ 3a Passt ideal zu:</label>
        <input type="text" id="winePairing" placeholder="z. B. Käse & Pasta 🧀" maxlength="25" oninput="updatePreview()">
      </div>

      <!-- LIVE OLED PREVIEW BOX -->
      <div class="oled-preview">
        <div class="oled-header">📺 OLED Display Live-Vorschau</div>
        <div class="oled-text" id="oledPreviewText">Geben Sie eine Nachricht ein...</div>
      </div>

      <button type="submit" id="submitBtn">Formgerecht zustellen ⚖️</button>
    </form>

    <div id="status"></div>

    <div class="legal-notice">
      Die Übermittlung erfolgt unverzüglich gemäß § 121 BGB auf das OLED-Display.
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0Ig0Ig2vyGpNtl1QXzs6dlk7qMKM8wxUtNq0bT0LxW6qAgy1nSz2NrxnK166q1hcW/exec";

    function switchMode(selectedCategory) {
      document.querySelectorAll('.mode-group').forEach(g => g.classList.remove('active'));
      const activeGroup = document.getElementById('mode-' + selectedCategory);
      if (activeGroup) activeGroup.classList.add('active');
      updatePreview();
    }

    function setQuick(senderName, msg) {
      document.getElementById("sender").value = senderName;
      document.getElementById("category").value = "TEXT";
      switchMode("TEXT");
      document.getElementById("msgText").value = msg;
      updatePreview();
    }

    function updatePreview() {
      const sender = document.getElementById("sender").value || "Absender";
      const category = document.getElementById("category").value;
      let msg = "";

      switch (category) {
        case "TEXT": msg = document.getElementById("msgText").value; break;
        case "URTEIL": msg = document.getElementById("verdictSelect").value; break;
        case "STATUS": msg = document.getElementById("statusSelect").value; break;
        case "COUNTDOWN":
          const name = document.getElementById("cdText").value || "Ereignis";
          const mins = document.getElementById("cdMinutes").value || "0";
          msg = `⏱️ ${name} in ${mins} Min!`;
          break;
        case "QUIZ": msg = `❓ Quiz: ${document.getElementById("quizQuestion").value}`; break;
        case "WINE":
          const w = document.getElementById("wineName").value || "Wein";
          const p = document.getElementById("winePairing").value || "Gute Laune";
          msg = `🍷 ${w} | Passt zu: ${p}`;
          break;
      }

      document.getElementById("oledPreviewText").innerText = `${sender}: ${msg || "..."}`;
    }

    document.getElementById("msgForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");
      const sender = document.getElementById("sender").value;
      const category = document.getElementById("category").value;
      const fullMessageText = document.getElementById("oledPreviewText").innerText;

      let msg = "";
      switch (category) {
        case "TEXT": msg = document.getElementById("msgText").value; break;
        case "URTEIL": msg = document.getElementById("verdictSelect").value; break;
        case "STATUS": msg = document.getElementById("statusSelect").value; break;
        case "COUNTDOWN":
          const name = document.getElementById("cdText").value || "Ereignis";
          const mins = document.getElementById("cdMinutes").value || "0";
          msg = `⏱️ ${name} in ${mins} Min!`;
          break;
        case "QUIZ": msg = `❓ Quiz: ${document.getElementById("quizQuestion").value}`; break;
        case "WINE":
          const w = document.getElementById("wineName").value || "Wein";
          const p = document.getElementById("winePairing").value || "Gute Laune";
          msg = `🍷 ${w} | Passt zu: ${p}`;
          break;
      }

      btn.disabled = true;
      btn.innerText = "Zustellung läuft...";
      status.style.color = "#a0aec0";
      status.innerText = "Prüfe Zustellungsfähigkeit...";

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ "sender": sender, "category": category, "message": msg })
      })
      .then(() => {
        status.style.color = "#4ECA78";
        status.innerText = "✓ Ordnungsgemäß auf dem Display zugestellt!";
        btn.disabled = false;
        btn.innerText = "Formgerecht zustellen ⚖️";
      })
      .catch(err => {
        status.style.color = "#e63956";
        status.innerText = "Fehler bei der Zustellung. Einspruch!";
        btn.disabled = false;
        btn.innerText = "Formgerecht zustellen ⚖️";
      });
    });

    // Initialisiere Vorschau
    updatePreview();
  </script>
</body>
</html>
