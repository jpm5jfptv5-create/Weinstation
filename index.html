<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amtliche Übermittlung | Wein-Botschaft ⚖️</title>
  <style>
    :root {
      --bg-color: #12151c;
      --card-bg: #1c2230;
      --accent: #d4af37; /* Juristisches Gold */
      --text: #f8f9fa;
      --subtext: #9aa5b8;
      --border-color: #2e384e;
    }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 440px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .header-icon {
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      color: var(--subtext);
      font-size: 0.85rem;
      margin-bottom: 25px;
      font-style: italic;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 6px;
      margin-top: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #12151c;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }

    select option {
      background-color: #1c2230;
      color: var(--text);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    .mode-group {
      display: none;
    }

    .mode-group.active {
      display: block;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #d4af37, #aa820a);
      color: #12151c;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
      transition: transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #status {
      margin-top: 15px;
      font-size: 0.85rem;
      min-height: 20px;
    }

    .legal-notice {
      margin-top: 20px;
      font-size: 0.7rem;
      color: #616e85;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-icon">⚖️ 🍷</div>
    <h1>Zustellungsanzeige</h1>
    <p>Formelle Übermittlung einer Willenserklärung an die Weinstation</p>

    <form id="msgForm">
      <!-- ABSENDER -->
      <label for="sender">§ 1 Absender / Erklärender:</label>
      <input type="text" id="sender" placeholder="z. B. Parteigänger Anna" required maxlength="15">

      <!-- KATEGORIE / MODUS WÄHLEN -->
      <label for="category">§ 2 Verfahrungsart / Modus:</label>
      <select id="category" onchange="switchMode(this.value)">
        <option value="TEXT">Freie Botschaft / Rüge</option>
        <option value="URTEIL">Gerichtliches Urteil / Beschluss</option>
        <option value="STATUS">Status & Gefühlsbarometer</option>
        <option value="COUNTDOWN">Ereignis / Countdown</option>
        <option value="QUIZ">Rätsel / Quiz-Frage</option>
        <option value="WINE">Wein-Tasting / Empfehlung</option>
      </select>

      <!-- MODUS 1: FREIER TEXT -->
      <div id="mode-TEXT" class="mode-group active">
        <label for="msgText">§ 3 Gegenstand der Erklärung:</label>
        <textarea id="msgText" rows="3" placeholder="Gegenstand der schriftlichen Rüge oder Botschaft..." maxlength="60"></textarea>
      </div>

      <!-- MODUS 2: URTEIL / BESCHLUSS -->
      <div id="mode-URTEIL" class="mode-group">
        <label for="verdictSelect">§ 3 Gerichtlicher Tenor:</label>
        <select id="verdictSelect">
          <option value="Der Beklagte wird verurteilt, unverzüglich Wein nachzuschenken.">Der Beklagte wird verurteilt, unverzüglich Wein nachzuschenken.</option>
          <option value="Einstweilige Verfügung: Sofortiger Stopp von Hausarbeiten!">Einstweilige Verfügung: Sofortiger Stopp von Hausarbeiten!</option>
          <option value="Beweisbeschluss: Die Qualität erfordert ein zweites Glas.">Beweisbeschluss: Die Qualität erfordert ein zweites Glas.</option>
          <option value="Urteil: Feierabend mit sofortiger Wirkung rechtskräftig.">Urteil: Feierabend mit sofortiger Wirkung rechtskräftig.</option>
        </select>
      </div>

      <!-- MODUS 3: STATUS / GEFÜHLSBAROMETER -->
      <div id="mode-STATUS" class="mode-group">
        <label for="statusSelect">§ 3 Aktueller Status:</label>
        <select id="statusSelect">
          <option value="🍷 Feierabend-Modus aktiv">🍷 Feierabend-Modus aktiv</option>
          <option value="🔋 Akku leer – bitte Wein/Kaffee einschenken">🔋 Akku leer – bitte Wein/Kaffee einschenken</option>
          <option value="🤫 Ruhe vor dem Gericht: Bitte nicht stören">🤫 Ruhe vor dem Gericht: Bitte nicht stören</option>
          <option value="🎉 Das Wochenende ist offiziell eingeläutet!">🎉 Das Wochenende ist offiziell eingeläutet!</option>
        </select>
      </div>

      <!-- MODUS 4: COUNTDOWN / EREIGNIS -->
      <div id="mode-COUNTDOWN" class="mode-group">
        <label for="cdText">§ 3 Ereignisbezeichnung:</label>
        <input type="text" id="cdText" placeholder="z. B. Pizza da / Ankunft" maxlength="30">
        <label for="cdMinutes">§ 3a Verbleibende Minuten:</label>
        <input type="number" id="cdMinutes" placeholder="z. B. 15" min="1" max="180">
      </div>

      <!-- MODUS 5: QUIZ / RÄTSEL -->
      <div id="mode-QUIZ" class="mode-group">
        <label for="quizQuestion">§ 3 Quiz-Frage:</label>
        <input type="text" id="quizQuestion" placeholder="z. B. Wer hat heute den Abwasch gemacht?" maxlength="50">
      </div>

      <!-- MODUS 6: WEIN-TASTING -->
      <div id="mode-WINE" class="mode-group">
        <label for="wineName">§ 3 Weinbezeichnung / Jahrgang:</label>
        <input type="text" id="wineName" placeholder="z. B. Pinot Noir 2021" maxlength="30">
        <label for="winePairing">§ 3a Passt ideal zu:</label>
        <input type="text" id="winePairing" placeholder="z. B. Käse & Pasta 🧀" maxlength="30">
      </div>

      <button type="submit" id="submitBtn">Formgerecht zustellen ⚖️</button>
    </form>

    <div id="status"></div>

    <div class="legal-notice">
      Die Übermittlung erfolgt unverzüglich gemäß § 121 BGB auf das OLED-Display.
    </div>
  </div>

  <script>
    // GOOGLE APPS SCRIPT URL:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgNUeYMpiBC9WNMyTA6n8P_30bwthCmVa8TVtlwa9KbcSeCd82UCfzhW3nLCnNn7a1/exec";

    function switchMode(selectedCategory) {
      // Alle Modus-Gruppen ausblenden
      const groups = document.querySelectorAll('.mode-group');
      groups.forEach(g => g.classList.remove('active'));

      // Ausgewählten Modus einblenden
      const activeGroup = document.getElementById('mode-' + selectedCategory);
      if (activeGroup) {
        activeGroup.classList.add('active');
      }
    }

    document.getElementById("msgForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");
      const sender = document.getElementById("sender").value;
      const category = document.getElementById("category").value;

      let finalMessage = "";

      // Nachricht je nach gewähltem Modus zusammensetzen
      switch (category) {
        case "TEXT":
          finalMessage = document.getElementById("msgText").value;
          break;
        case "URTEIL":
          finalMessage = document.getElementById("verdictSelect").value;
          break;
        case "STATUS":
          finalMessage = document.getElementById("statusSelect").value;
          break;
        case "COUNTDOWN":
          const eventName = document.getElementById("cdText").value || "Ereignis";
          const mins = document.getElementById("cdMinutes").value || "0";
          finalMessage = `⏱️ ${eventName} in ${mins} Min!`;
          break;
        case "QUIZ":
          finalMessage = `❓ Quiz: ${document.getElementById("quizQuestion").value}`;
          break;
        case "WINE":
          const wName = document.getElementById("wineName").value || "Wein";
          const wPair = document.getElementById("winePairing").value || "Gute Laune";
          finalMessage = `🍷 ${wName} | Passt zu: ${wPair}`;
          break;
      }

      if (!finalMessage.trim()) {
        status.style.color = "#e63956";
        status.innerText = "Bitte fülle die Inhaltsfelder aus!";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Zustellung läuft...";
      status.style.color = "#9aa5b8";
      status.innerText = "Prüfe Zustellungsfähigkeit...";

      // Daten an Google Apps Script senden (inkl. Kategorie & formatierter Nachricht)
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Verhindert CORS-Blockaden von Google Script
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
          "sender": sender,
          "category": category,
          "message": finalMessage
        })
      })
      .then(() => {
        status.style.color = "#4ECA78";
        status.innerText = "✓ Ordnungsgemäß auf dem Display zugestellt!";
        btn.disabled = false;
        btn.innerText = "Formgerecht zustellen ⚖️";
      })
      .catch(err => {
        status.style.color = "#e63956";
        status.innerText = "Fehler bei der Zustellung. Einspruch einlegen!";
        btn.disabled = false;
        btn.innerText = "Formgerecht zustellen ⚖️";
      });
    });
  </script>
</body>
</html>
