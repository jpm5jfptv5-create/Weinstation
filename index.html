<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amtliche Übermittlung | Wein-Botschaft ⚖️</title>
  <style>
    :root {
      --bg-color: #12151c;
      --card-bg: #1c2230;
      --accent: #d4af37; /* Juristisches Gold */
      --text: #f8f9fa;
      --subtext: #9aa5b8;
      --border-color: #2e384e;
    }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-bg);
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .header-icon {
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      color: var(--subtext);
      font-size: 0.85rem;
      margin-bottom: 25px;
      font-style: italic;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 6px;
      margin-top: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #12151c;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #d4af37, #aa820a);
      color: #12151c;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
      transition: transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #status {
      margin-top: 15px;
      font-size: 0.85rem;
      min-height: 20px;
    }

    .legal-notice {
      margin-top: 20px;
      font-size: 0.7rem;
      color: #616e85;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-icon">⚖️ 🍷</div>
    <h1>Zustellungsanzeige</h1>
    <p>Formelle Übermittlung einer Willenserklärung an die Weinstation</p>

    <form id="msgForm">
      <label for="sender">§ 1 Absender / Erklärender:</label>
      <input type="text" id="sender" placeholder="z. B. Parteigänger Anna" required maxlength="15">

      <label for="message">§ 2 Gegenstand der Erklärung:</label>
      <textarea id="message" rows="3" placeholder="Gegenstand der schriftlichen Rüge oder Botschaft..." required maxlength="60"></textarea>

      <button type="submit" id="submitBtn">Formgerecht zustellen ⚖️</button>
    </form>

    <div id="status"></div>

    <div class="legal-notice">
      Die Übermittlung erfolgt unverzüglich gemäß § 121 BGB auf das OLED-Display.
    </div>
  </div>

  <script>
    // GOOGLE APPS SCRIPT URL:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgNUeYMpiBC9WNMyTA6n8P_30bwthCmVa8TVtlwa9KbcSeCd82UCfzhW3nLCnNn7a1/exec";

    document.getElementById("msgForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");
      const sender = document.getElementById("sender").value;
      const message = document.getElementById("message").value;

      btn.disabled = true;
      btn.innerText = "Zustellung läuft...";
      status.style.color = "#9aa5b8";
      status.innerText = "Prüfe Zustellungsfähigkeit...";

      // Daten an Google Apps Script senden
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Verhindert CORS-Blockaden von Google Script
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({
          "sender": sender,
          "message": message
        })
      })
      .then(() => {
        status.style.color = "#4ECA78";
        status.innerText = "✓ Ordnungsgemäß auf dem Display zugestellt!";
        document.getElementById("message").value = "";
        btn.disabled = false;
        btn.innerText = "Formgerecht zustellen ⚖️";
      })
      .catch(err => {
        status.style.color = "#e63956";
        status.innerText = "Fehler bei der Zustellung. Einspruch einlegen!";
        btn.disabled = false;
        btn.innerText = "Formgerecht zustellen ⚖️";
      });
    });
  </script>
</body>
</html>
