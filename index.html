<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weinstation — Übermittlung</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --accent-blue: #2997ff;
      --text-primary: #f5f5f7;
      --text-secondary: #86868b;
      --input-bg: rgba(118, 118, 128, 0.18);
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 36px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .apple-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-blue);
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin: 0 0 6px 0;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-weight: 400;
      line-height: 1.35;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      margin-top: 18px;
      letter-spacing: -0.005em;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%86868b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      padding-right: 36px;
    }

    select option {
      background-color: #1c1c1e;
      color: var(--text-primary);
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(41, 151, 255, 0.25);
    }

    .mode-group {
      display: none;
    }

    .mode-group.active {
      display: block;
    }

    /* APPLE HARDWARE OLED PREVIEW */
    .oled-hardware-container {
      margin-top: 24px;
      background: #000;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      position: relative;
    }

    .oled-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #1c1c1e;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .oled-text {
      font-family: "SF Mono", "Courier New", monospace;
      font-size: 0.85rem;
      color: #34c759;
      min-height: 36px;
      word-break: break-word;
      line-height: 1.3;
    }

    /* APPLE PILL BUTTONS */
    .btn-submit {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background-color: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 980px;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: scale(1.005);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    #status {
      margin-top: 16px;
      font-size: 0.82rem;
      min-height: 20px;
      font-weight: 500;
    }

    .footer-legal {
      margin-top: 24px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="apple-badge">Weinstation Display OS</div>
    <h1>Nachricht senden</h1>
    <div class="subtitle">Übermittle eine Botschaft oder Anweisung direkt an das OLED-Display.</div>

    <form id="msgForm">
      <!-- ABSENDER -->
      <label for="sender">Absender</label>
      <input type="text" id="sender" placeholder="z. B. Anna" required maxlength="15" oninput="updatePreview()">

      <!-- MODUS SELEKTION -->
      <label for="category">Modus auswählen</label>
      <select id="category" onchange="switchMode(this.value)">
        <option value="TEXT">Freie Nachricht</option>
        <option value="URTEIL">Gerichtliches Urteil</option>
        <option value="STATUS">Status-Update</option>
        <option value="COUNTDOWN">Countdown</option>
        <option value="WINE">Wein-Empfehlung</option>
      </select>

      <!-- MODUS 1: FREIER TEXT -->
      <div id="mode-TEXT" class="mode-group active">
        <label for="msgText">Nachrichtentext</label>
        <textarea id="msgText" rows="2" placeholder="Deine Nachricht..." maxlength="60" oninput="updatePreview()"></textarea>
      </div>

      <!-- MODUS 2: URTEIL -->
      <div id="mode-URTEIL" class="mode-group">
        <label for="verdictSelect">Tenor auswählen</label>
        <select id="verdictSelect" onchange="updatePreview()">
          <option value="Der Beklagte wird verurteilt, unverzüglich Wein nachzuschenken.">Der Beklagte wird verurteilt, unverzüglich Wein nachzuschenken.</option>
          <option value="Einstweilige Verfügung: Sofortiger Stopp von Hausarbeiten!">Einstweilige Verfügung: Sofortiger Stopp von Hausarbeiten!</option>
          <option value="Beweisbeschluss: Die Qualität erfordert ein zweites Glas.">Beweisbeschluss: Die Qualität erfordert ein zweites Glas.</option>
          <option value="Urteil: Feierabend mit sofortiger Wirkung rechtskräftig.">Urteil: Feierabend mit sofortiger Wirkung rechtskräftig.</option>
        </select>
      </div>

      <!-- MODUS 3: STATUS -->
      <div id="mode-STATUS" class="mode-group">
        <label for="statusSelect">Status auswählen</label>
        <select id="statusSelect" onchange="updatePreview()">
          <option value="🍷 Feierabend-Modus aktiv">🍷 Feierabend-Modus aktiv</option>
          <option value="🔋 Akku leer – bitte Wein/Kaffee einschenken">🔋 Akku leer – bitte Wein/Kaffee einschenken</option>
          <option value="🤫 Ruhe vor dem Gericht: Bitte nicht stören">🤫 Ruhe vor dem Gericht: Bitte nicht stören</option>
          <option value="🎉 Das Wochenende ist offiziell eingeläutet!">🎉 Das Wochenende ist offiziell eingeläutet!</option>
        </select>
      </div>

      <!-- MODUS 4: COUNTDOWN -->
      <div id="mode-COUNTDOWN" class="mode-group">
        <label for="cdText">Ereignis</label>
        <input type="text" id="cdText" placeholder="z. B. Pizza da" maxlength="25" oninput="updatePreview()">
        <label for="cdMinutes">Minuten</label>
        <input type="number" id="cdMinutes" placeholder="15" min="1" max="180" oninput="updatePreview()">
      </div>

      <!-- MODUS 5: WEIN-TASTING -->
      <div id="mode-WINE" class="mode-group">
        <label for="wineName">Wein / Jahrgang</label>
        <input type="text" id="wineName" placeholder="Pinot Noir 2021" maxlength="25" oninput="updatePreview()">
        <label for="winePairing">Passt zu</label>
        <input type="text" id="winePairing" placeholder="Käse & Pasta 🧀" maxlength="25" oninput="updatePreview()">
      </div>

      <!-- HARDWARE DISPLAY PREVIEW -->
      <div class="oled-hardware-container">
        <div class="oled-header">
          <span>OLED Live-Vorschau</span>
          <span>0.96″ Display</span>
        </div>
        <div class="oled-text" id="oledPreviewText">Warte auf Eingabe...</div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Senden</button>
    </form>

    <div id="status"></div>

    <div class="footer-legal">
      Übertragung via Google Script Endpoint auf ESP32-C3 Hardware.
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0Ig0Ig2vyGpNtl1QXzs6dlk7qMKM8wxUtNq0bT0LxW6qAgy1nSz2NrxnK166q1hcW/exec";

    function switchMode(selectedCategory) {
      document.querySelectorAll('.mode-group').forEach(g => g.classList.remove('active'));
      const activeGroup = document.getElementById('mode-' + selectedCategory);
      if (activeGroup) activeGroup.classList.add('active');

      updatePreview();
    }

    function updatePreview() {
      const sender = document.getElementById("sender").value || "Absender";
      const category = document.getElementById("category").value;
      let msg = "";

      switch (category) {
        case "TEXT": msg = document.getElementById("msgText").value; break;
        case "URTEIL": msg = document.getElementById("verdictSelect").value; break;
        case "STATUS": msg = document.getElementById("statusSelect").value; break;
        case "COUNTDOWN":
          const name = document.getElementById("cdText").value || "Ereignis";
          const mins = document.getElementById("cdMinutes").value || "0";
          msg = `⏱️ ${name} in ${mins} Min!`;
          break;
        case "WINE":
          const w = document.getElementById("wineName").value || "Wein";
          const p = document.getElementById("winePairing").value || "Gute Laune";
          msg = `🍷 ${w} | Passt zu: ${p}`;
          break;
      }

      document.getElementById("oledPreviewText").innerText = `${sender}: ${msg || "..."}`;
    }

    document.getElementById("msgForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");
      const sender = document.getElementById("sender").value;
      const category = document.getElementById("category").value;
      
      let msg = "";

      switch (category) {
        case "TEXT": msg = document.getElementById("msgText").value; break;
        case "URTEIL": msg = document.getElementById("verdictSelect").value; break;
        case "STATUS": msg = document.getElementById("statusSelect").value; break;
        case "COUNTDOWN":
          const name = document.getElementById("cdText").value || "Ereignis";
          const mins = document.getElementById("cdMinutes").value || "0";
          msg = `⏱️ ${name} in ${mins} Min!`;
          break;
        case "WINE":
          const w = document.getElementById("wineName").value || "Wein";
          const p = document.getElementById("winePairing").value || "Gute Laune";
          msg = `🍷 ${w} | Passt zu: ${p}`;
          break;
      }

      btn.disabled = true;
      btn.innerText = "Sende...";
      status.style.color = "#86868b";
      status.innerText = "Verbindung wird aufgebaut...";

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ "sender": sender, "category": category, "message": msg })
      })
      .then(() => {
        status.style.color = "#30d158";
        status.innerText = "✓ Erfolgreich an das Display gesendet!";
        btn.disabled = false;
        btn.innerText = "Senden";
      })
      .catch(err => {
        status.style.color = "#ff453a";
        status.innerText = "Übertragung fehlgeschlagen.";
        btn.disabled = false;
        btn.innerText = "Senden
